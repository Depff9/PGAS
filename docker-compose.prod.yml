# Production на VPS: только PostgreSQL + backend.
# Frontend по-прежнему отдаёт host-nginx из ./dist (см. docs/DOCKER.md).
# API: host-nginx → 127.0.0.1:4000
#
# cp .env.production.example .env.production
# docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-pgas_system}
    volumes:
      - ${PGAS_DATA_DIR:-./data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pgas_system}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pgas_system}?schema=public
      NODE_ENV: production
      PGAS_SEED_ON_START: ${PGAS_SEED_ON_START:-false}
    ports:
      - '127.0.0.1:4000:4000'
