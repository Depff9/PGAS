name: Deploy to VPS

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: VPS_APP_DIR,VITE_API_URL
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${VPS_APP_DIR:-/var/www/pgas-system}"
            cd "$APP_DIR"
            git fetch origin
            git reset --hard origin/main
            chmod +x scripts/deploy-docker.sh
            VITE_API_URL="${VITE_API_URL:-https://api.pgas-demo-site.online/api}" ./scripts/deploy-docker.sh
