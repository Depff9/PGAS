name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: 'Способ деплоя на VPS'
        required: true
        default: pm2
        type: choice
        options:
          - pm2
          - docker

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: VITE_API_URL=https://api.example.test/api npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Prisma generate
        working-directory: backend
        run: npx prisma generate

      - name: Validate Docker Compose (dev)
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate Docker Compose (prod)
        env:
          POSTGRES_PASSWORD: ci-check-only
        run: docker compose -f docker-compose.prod.yml config --quiet

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          DEPLOY_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_mode || secrets.DEPLOY_MODE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: VPS_APP_DIR,VITE_API_URL,DEPLOY_MODE
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${VPS_APP_DIR:-/var/www/pgas-system}"
            MODE="${DEPLOY_MODE:-pm2}"
            cd "$APP_DIR"
            git fetch origin
            git reset --hard origin/main
            chmod +x scripts/deploy-pm2.sh scripts/deploy-docker.sh
            export DEPLOY_SKIP_GIT=1
            export VITE_API_URL="${VITE_API_URL:-https://api.pgas-demo-site.online/api}"
            if [ "$MODE" = "docker" ]; then
              ./scripts/deploy-docker.sh
            else
              ./scripts/deploy-pm2.sh
            fi
