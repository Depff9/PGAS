name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: VITE_API_URL=https://api.example.test/api npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Prisma generate
        working-directory: backend
        run: npx prisma generate

      - name: Validate Docker Compose config
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Build Docker images
        run: |
          docker build -f backend/Dockerfile -t pgas-backend:ci .
          docker build -f docker/frontend.Dockerfile --build-arg VITE_API_URL=http://localhost:8080/api -t pgas-frontend:ci .
